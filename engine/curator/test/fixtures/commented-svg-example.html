<main>
<h1>An SVG inside a comment neither fails the page nor discharges an obligation</h1>

<h2>Mechanism — the write path</h2>
<p>The only SVG in this section is commented out, so this section still owes a drawing. If a
commented SVG counted, an artifact could satisfy the rule by writing about a diagram.</p>
