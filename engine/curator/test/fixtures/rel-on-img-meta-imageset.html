<h1>rel does not inert anything except a link</h1>

<p>The browser fetches this image; rel is decoration on an img:</p>
<img rel="canonical" src="https://cdn.example.com/x.png" alt="x">

<p>And a link that really is canonical still fetches nothing:</p>
<link rel="canonical" href="https://example.atlassian.net/browse/PROJ-2565">
