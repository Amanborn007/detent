<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selectors that name no hook, and unquoted attributes</title>
<style>
  :root { --paper:#faf8f5; --ink:#16273c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#14181c; --ink:#e8e6e2; }
  }
  body { background:var(--paper); color:var(--ink); }
  /* Names neither svg, nor a class, nor an element type — and paints the diagram. */
  *[role="img"] { fill: #ffffff; }
  /* A descendant combinator onto the universal selector does the same. */
  .diagram > * { stroke: #16273c; }
</style>
</head>
<body>
<main>
<h1>fill and stroke are SVG-only, so the selector cannot excuse them</h1>

<p>A genuinely inert link in its unquoted form must stay unreported:</p>
<link rel=canonical href=https://example.atlassian.net/browse/PROJ-2565>

<div class="diagram">
  <svg viewBox="0 0 200 60" role="img" aria-labelledby="sf-t sf-d">
    <title id="sf-t">Painted from rules that name no hook</title>
    <desc id="sf-d">One box whose paint arrives through an attribute selector.</desc>
    <rect class=node x="10" y="10" width="180" height="40" rx="5"/>
  </svg>
</div>
</main>
</body>
</html>
