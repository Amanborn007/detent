<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An ordinary Current state heading is not a gate</title>
<style>
  :root { --paper:#faf8f5; --ink:#16273c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper:#14181c; --ink:#e8e6e2; }
  }
  body { background:var(--paper); color:var(--ink); }
</style>
</head>
<body>
<main>
<h1>A recommended drawing warns and does not refuse the page</h1>

<h2>Current state</h2>
<p>blocks.md marks the before-and-after drawing recommended, and says to skip it only when the
delta is a single named piece. This section is exactly that case: one flag moves.</p>
</main>
</body>
</html>
