<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The rel exemption needs every token to be non-fetching</title>
<style>
  @media (prefers-color-scheme: dark) { :root { --paper:#14181c; } }
</style>

<!-- alternate is inert, stylesheet is not, so the tag still fetches -->
<link rel="alternate stylesheet" href="https://cdn.example.com/b.css">
<!-- opens a TCP and TLS connection -->
<link rel="preconnect" href="https://fonts.gstatic.com">
<!-- resolves a name -->
<link rel="dns-prefetch" href="https://cdn.example.com">

<!-- these fetch nothing and must NOT be reported -->
<link rel="canonical" href="https://example.atlassian.net/browse/PROJ-2565">
<link rel="author license" href="https://example.com/who">
</head>
<body>
<main>
<h1>Three of these five links reach the network</h1>
<p>Exempting a tag because one of its rel tokens is inert was a bypass.</p>
</main>
</body>
</html>
